# Alembic (docs/05-data.md §12). Si esegue da `backend/` come `menu_owner`:
#   DATABASE_URL_OWNER=postgresql+psycopg://menu_owner:...@host:port/db?sslmode=verify-full&sslrootcert=...
#   uv run alembic upgrade head
# L'URL NON sta in questo file: `migrations/env.py` lo legge da DATABASE_URL_OWNER e rifiuta
# ruoli diversi da `menu_owner` e URL senza `sslmode=verify-full`.
# La tabella `alembic_version` sta nello schema `app` (impostato in env.py).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# Revisioni con ID a 4 cifre: `alembic revision --rev-id 0002 -m "identity"`.
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
