name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.4"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  OSV_SCANNER_VERSION: "2.7.0"
  OSV_SCANNER_SHA256: "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b"
  SEMGREP_SEND_METRICS: "off"

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tgz
      - name: Gitleaks (history and working tree)
        run: make scan-secrets

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Cluster di test effimero sulla VM del job: password usa e getta, porta solo su localhost.
      # MENU_TEST_PG_ADMIN_PASSWORD impostata = cluster esterno (il Makefile non avvia compose).
      MENU_TEST_PG_ADMIN_PASSWORD: ci-throwaway-pg-admin
      MENU_TEST_PG_HOST: localhost
      MENU_TEST_PG_PORT: "5432"
      MENU_TEST_PG_CA: ${{ github.workspace }}/db/dev-certs/ca.crt
    services:
      postgres:
        image: postgres:17@sha256:a63c1ea3f6a3a5a1621f97d2aba3b30faecfab4224c1b0000cc85ced57bb1939
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-throwaway-pg-admin
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --name menu-pg
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: false
      - name: TLS for the PostgreSQL service (the app enforces verify-full)
        run: ./scripts/ci-pg-tls.sh menu-pg
      - name: Lint, format, mypy, bandit
        run: make lint
      - name: Unit and architecture tests
        run: make test-unit
      - name: Contract tests
        run: make test-contract
      - name: Database tests and migrations
        run: make test-db
      - name: Integration tests
        run: make test-int
      - name: Security tests
        run: make test-sec
      - name: Property tests (ci-small)
        run: make test-prop
      - name: Concurrency tests (x3)
        run: make test-conc

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Enable pnpm (corepack, version from web/package.json)
        run: corepack enable
      - name: Lint, format, types, i18n, unit tests, generated client, build, budget
        run: make tier-web

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Lo stack degli e2e (backend/tests/support/e2e_stack.py) crea un database sul cluster di
      # test effimero della VM, come il job `backend`.
      MENU_TEST_PG_ADMIN_PASSWORD: ci-throwaway-pg-admin
      MENU_TEST_PG_HOST: localhost
      MENU_TEST_PG_PORT: "5432"
      MENU_TEST_PG_CA: ${{ github.workspace }}/db/dev-certs/ca.crt
    services:
      postgres:
        image: postgres:17@sha256:a63c1ea3f6a3a5a1621f97d2aba3b30faecfab4224c1b0000cc85ced57bb1939
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-throwaway-pg-admin
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --name menu-pg
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Enable pnpm (corepack, version from web/package.json)
        run: corepack enable
      - name: Backend dependencies (the server that serves the SPA)
        run: make sync
      - name: TLS for the PostgreSQL service (the app enforces verify-full)
        run: ./scripts/ci-pg-tls.sh menu-pg
      - name: Web dependencies
        run: make web-install
      - name: Install Chromium (explicit download, with system libraries)
        run: cd web && pnpm exec playwright install --with-deps chromium
      - name: Playwright (mobile 360 px and desktop, axe)
        run: make e2e
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: web/test-results
          retention-days: 7
          if-no-files-found: ignore

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HADOLINT_VERSION: "2.15.1"
      HADOLINT_SHA256: "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507"
      TRIVY_VERSION: "0.76.0"
      TRIVY_SHA256: "e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: false
      - name: Install hadolint
        run: |
          curl -fsSL -o hadolint "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  hadolint" | sha256sum -c -
          sudo install -m 0755 hadolint /usr/local/bin/hadolint
          rm -f hadolint
      - name: Install trivy
        run: |
          curl -fsSL -o trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar -xzf trivy.tgz trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          rm -f trivy trivy.tgz
      - name: hadolint, build, trivy image and config, image tests
        run: make tier-container

  sast:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: false
      - name: Install semgrep
        run: make tools-semgrep
      - name: Semgrep (regole custom e scansione)
        run: make scan-sast

  deps:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Enable pnpm (corepack, version from web/package.json)
        run: corepack enable
      - name: Install osv-scanner
        run: |
          curl -fsSL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum -c -
          sudo install -m 0755 osv-scanner /usr/local/bin/osv-scanner
          rm -f osv-scanner
      - name: pip-audit and osv-scanner
        run: make scan-deps
      - name: pnpm audit (high and critical, including devDependencies)
        run: make scan-web

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: false
      - name: Install zizmor
        run: make tools-zizmor
      - name: zizmor
        run: make scan-workflows
      - name: Actions pinned to SHA, no dangerous trigger
        run: |
          if grep -RnE '^\s*-?\s*uses:\s*[^./][^@]*@' .github/workflows | grep -vE '@[0-9a-f]{40}(\s|$)'; then
            echo "ERRORE: azione non fissata a SHA" >&2; exit 1
          fi
          if grep -RnE '(^|[^A-Za-z_])pull_request_targe[t]($|[^A-Za-z_])' .github/workflows; then
            echo "ERRORE: trigger vietato" >&2; exit 1
          fi
